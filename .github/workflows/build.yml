name: Build APK
on:
  push: { branches: [main], tags: ['v*'] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - env:
          PLANTNET_KEY: ${{ secrets.PLANTNET_KEY }}
        run: chmod +x gradlew && ANDROID_HOME=$ANDROID_SDK_ROOT ./gradlew assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk giyahbin.apk
      - uses: actions/upload-artifact@v4
        with: { name: giyahbin-apk, path: giyahbin.apk }
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: giyahbin.apk }
